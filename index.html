<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LuLuCheeky's Website</title>
	<link rel="icon" type="image/png" sizes="32x32" href="CUTEBANANA.png">
    <style>
		body {
    		text-align: center;
    		font-family: clarity-city, sans-serif;
		}

		h1 {
   			text-align: center;
    		font-size: 40px;
		}

		p {
   			font-size: 30px;
		}

		a {
   			font-size: 30px;
    		text-align: center;
		}

		section {
    		background-color: white;
    		color: black;
    		border: 4px ridge silver;
    		margin: 20px auto;
    		padding: 15px;
    		max-width: 600px;
		}

		nav {
    		background-color: silver;
    		border: 3px outset white;
   		 	padding: 10px;
    		margin: 15px auto;
    		max-width: 600px;
		}

		nav a {
   		 	color: blue;
    		text-align: center;
		}

		nav a:visited {
    		color: purple;
    		text-align: center;
		}

		dialog {
    		border: none;
    		border-radius: 12px;
    		padding: 24px;
    		width: 90%;
    		max-width: 350px;
    		box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
		}

		dialog::backdrop {
    		background-color: rgba(0, 0, 0, 0.4);
		}

		.options-list {
    		display: flex;
    		flex-direction: column;
    		gap: 10px;
    		margin-bottom: 15px;
		}

		.options-list button {
    		padding: 12px;
    		text-align: left;
    		border: 1px solid #ccc;
    		border-radius: 6px;
    		background-color: #f9f9f9;
    		font-size: 16px;
    		cursor: pointer;
    		transition: background 0.2s;
		}

		.options-list button:hover {
    		background-color: #ffeb36;
    		border-color: #ffe600;
		}

		hr {
	    	border: 0;
   			border-top: 1px solid #eee;
   			margin: 15px 0;
		}

		#cancelBtn {
    		width: 100%;
   		 	padding: 10px;
   		 	background: none;
    		border: none;
    		color: #666;
    		cursor: pointer;
		}

		#cookieContainer {
    		position: fixed;
   			top: 0;
    		left: 0;
    		width: 100vw;
    		height: 100vh;
    		display: none; 
    		align-items: center;
    		justify-content: center;
    		z-index: 9999;
    		background-color: rgba(0, 0, 0, 0.8); 
    		backdrop-filter: blur(10px);
    		-webkit-backdrop-filter: blur(10px);
    		opacity: 0;
    		transition: opacity 0.3s ease;
		}

		#cookieImage {
    		cursor: pointer;
   		 	user-select: none;
    		width: 500px;
    		height: 500px;
    		display: block;      
    		margin: 0 auto;    
   		 	filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.5)); 
    		transform: scale(0);
    		transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
		}
	
		#cookieImage img {
    		width: 100%;
    		height: 100%;
    		display: block;
		}

		@keyframes click {
    		0% { transform: scale(1); }
    		30% { transform: scale(0.85); }
    		70% { transform: scale(1.05); }
    		100% { transform: scale(1); }
		}

		.click-animate {
    		animation: click 0.2s ease-out forwards !important;
		}

		#visitorCount {
   		 	display: inline-block;
    		background-color: black;
    		color: lime;
    		font-family: monospace;
    		font-size: 28px;
    		padding: 8px 12px;
   		 	border: 3px inset white;
    		letter-spacing: 4px;
		}
    </style>
</head>
<body>
    <h1>Hi!</h1>
    <p>This is my new website :)</p>
    <p>i put random stuff here; feel free to check it out</p>
    <br><br>
    
    <p>Games i make when im bored</p>
    <nav>
        <a href="humanNinja.html">fruit ninja but cursed</a> | 
        <a href="clicker.html">clicker</a>
    </nav>
    
    <button id="openBtn">Choose an Option</button>
    
    <dialog id="optionsPopup">
        <h2>Hello!</h2>
        <p>Please accept cookies for the best experience</p>
        <div class="options-list">
            <button type="button" id="cookieAcceptBtn">COOKIE</button>
            <button type="button" id="cookieRejectBtn">no dont hack me</button>
        </div>
        <hr>
        <button type="button" id="cancelBtn">Cancel</button>
    </dialog>
    
    <p id="resultText">No option chosen yet.</p>

    <div id="cookieContainer">
        <div id="cookieImage"></div>
    </div>
	
	<p>You are visitor number</p>
	<p id="visitorCount">000001</p>
	<p>Thanks for checking out my website!</p>
	
	<script src="index.js"></script>
</body>
