<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <title>LuLuCheeky's Website</title> 
    <style> 
        
        body { 
            text-align: center; 
            font-family: clarity-city;
        }
        
        h1 {
            text-align: center;
            font-size: 40px;
        }
        
        p { 
            font-size: 30px; 
        } 
        
        a { 
            font-size: 30px; 
            text-align: center;
        } 
        
        section {
            background-color: white;
            color: black;
            border: 4px ridge silver;
            margin: 20px auto;
            padding: 15px;
            max-width: 600px;
        }

        nav {
            background-color: silver;
            border: 3px outset white;
            padding: 10px;
            margin: 15px auto;
            max-width: 600px;
        }

        nav a {
            color: blue;
            text-align: center;
        }

        nav a:visited {
            color: purple;
            text-align: center;
        }

        dialog {
          border: none;
          border-radius: 12px;
          padding: 24px;
          width: 90%;
          max-width: 350px;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        dialog::backdrop {
          background-color: rgba(0, 0, 0, 0.4);
        }    

        .options-list {
          display: flex;
          flex-direction: column;
          gap: 10px;
          margin-bottom: 15px;
        }

        .options-list button {
          padding: 12px;
          text-align: left;
          border: 1px solid #ccc;
          border-radius: 6px;
          background-color: #f9f9f9;
          font-size: 16px;
          cursor: pointer;
          transition: background 0.2s;
        }

        .options-list button:hover {
          background-color: #e6f7ff;
          border-color: #1890ff;
        }

        hr {
          border: 0;
          border-top: 1px solid #eee;
          margin: 15px 0;
        }

        #cancelBtn {
          width: 100%;
          padding: 10px;
          background: none;
          border: none;
          color: #666;
          cursor: pointer;
        }

    </style> 
</head> 
<body>
