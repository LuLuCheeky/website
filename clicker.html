<!DOCTYPE html>
<html>
<head lang = "en">
    <title>a clicker</title>
    <meta charset = "UTF-8">
  
    <style> 
       body { 
          text-align: center; 
          font-family: clarity-city;
      }
       p { 
          font-size: 30px; 
      } 
      a { 
         font-size: 30px;
      }  

    #clicker {
      background-color: #c0c0c0;
      color: black;
      font-family: "Comic Sans MS", cursive;
      font-size: 20px;
      padding: 10px 20px;
      border: 3px outset white;
      cursor: pointer;
	  text-align: center;
	  bottom: 200px;
      right: 1000px;  
      z-index: 1000; 
    }

    #clicker:hover {
      background-color: grey;
    }

    #clicker:active {
		background-color: rgb(158, 158, 158);
    }

	
	@keyframes floatUp {
   		0% {
     	   transform: translateY(0);
      	  opacity: 1;
 	   }

 	   100% {
      	  transform: translateY(-60px);
      	  opacity: 0;
   	   }
	}

	.floating-text {
		position: absolute;
		color: black;
 	    font-size: 24px;
		font-weight: bold;
		pointer-events: none;
		animation: floatUp 0.8s ease-out forwards;
	}


	.floating-text {
    	position: fixed;
    	left: 200px;
   		top: 200px;
   		color: black;
    	font-size: 24px;
   		font-weight: bold;
    	pointer-events: none;
    	animation: floatUp 0.8s ease-out forwards;
	}

	@keyframes clickBounce {
    	0% {
        	transform: scale(1);
    	}

    	45% {
        	transform: scale(0.9);
    	}

    	70% {
        	transform: scale(1.1);
    	}

    	100% {
        	transform: scale(1);
    	}
	}

	.click-animate {
    	animation: clickBounce 0.2s ease-out;
	}

  </style> 

</head>

<body>
	<p>clicks: <span id="clicks">0</span></p>

	<button id="clicker">click</button>

 	<canvas id="gameCanvas" width="800" height="600"></canvas>

    <script src="clicker.js"></script>

</body>
</html>
